const automaticData = [37.32, 33.97, 59.81, 55.98, 11.48];
const hybridData = [36.84, 33.97, 57.89, 55.50, 11.96];

  [3, 45.51, 78.13], // AL
  [4, 5.31, 29.68]   // GN
];

option = {
